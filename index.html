<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STK Kufri Logistics</title>

    <!--
      웹 보안 헤더(개발 보안 체크리스트 7-03).
      GitHub Pages 는 응답 헤더를 설정할 수 없어 meta 로 가능한 범위만 적용한다.
      script-src 'self' 이므로 인라인 스크립트와 인라인 이벤트 속성은 동작하지 않는다.
      frame-ancestors / HSTS / X-Content-Type-Options 는 meta 에서 동작하지 않는다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-src https://login.microsoftonline.com;
               connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://startruckkorea.sharepoint.com"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header>
      <h1>STK Kufri Logistics</h1>
      <span id="user"></span>
      <button id="login" hidden>Microsoft 로그인</button>
      <button id="logout" hidden>로그아웃</button>
    </header>

    <p id="status">초기화 중...</p>
    <p id="scopes"></p>

    <table id="files" hidden>
      <thead>
        <tr>
          <th>이름</th>
          <th>크기</th>
          <th>수정한 날짜</th>
          <th>엑셀</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <section id="preview" hidden></section>
    <section id="result" hidden></section>

    <script src="js/vendor/msal-browser.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>

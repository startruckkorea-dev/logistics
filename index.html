<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STK Logistics Hub</title>

    <!--
      웹 보안 헤더(개발 보안 체크리스트 7-03).
      GitHub Pages 는 응답 헤더를 설정할 수 없어 meta 로 가능한 범위만 적용한다.
      script-src 'self' 이므로 인라인 스크립트와 인라인 이벤트 속성은 동작하지 않는다.
      frame-ancestors / HSTS / X-Content-Type-Options 는 meta 에서 동작하지 않는다.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self';
               img-src 'self' data:;
               font-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-src https://login.microsoftonline.com;
               connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com https://startruckkorea.sharepoint.com"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- 상단 메뉴 바 -->
    <header class="topbar">
      <div class="logo">STK Logistics Hub <span class="tag" id="envTag" hidden></span></div>
      <nav id="nav"></nav>
      <div class="afab-last" id="baseDate" hidden></div>
      <div class="langbox" id="langbox" title="언어 전환 / Language">
        <button type="button" data-lang="ko" class="active">한</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="userbox" id="userbox" hidden>
        <b id="userName"></b>
        <button id="logout" type="button">로그아웃</button>
      </div>
    </header>

    <main class="page" id="app"></main>

    <!-- 드로어 · 모달 · 알림 · 툴팁 -->
    <div class="drawer-bg" id="drawer-bg"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-head" id="drawer-head"></div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
    <div class="modal-bg" id="modal-bg">
      <div class="modal">
        <div class="modal-h">
          <h2 id="modal-title"></h2>
          <button class="x" id="modal-close" type="button">×</button>
        </div>
        <div class="modal-b" id="modal-body"></div>
        <div class="modal-f" id="modal-foot"></div>
      </div>
    </div>
    <div id="toast"></div>
    <div class="tip" id="tip"></div>

    <script src="js/vendor/msal-browser.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STK Logistics Hub — 화면 목업 v0.1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 상단 메뉴 바 (G1) -->
  <header class="topbar">
    <div class="logo">STK Logistics Hub <span class="tag">목업 v0.1</span></div>
    <nav id="nav"></nav>
    <div class="afab-last" title="AFAB_Uploads 최근 반영">AFAB 최근 반영 <b>2026-10-07 08:42</b> · 677행 · 변경 1</div>
  </header>
  <!-- 화면 제목 줄 (G2) -->
  <div class="titlebar">
    <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
    <span class="spacer"></span>
    <div class="search" title="Comm / VIN / B/L 통합 검색 — 1건이면 상세 즉시">
      <span>🔍</span><input id="gsearch" placeholder="통합 검색: Comm / VIN / B/L"><span class="hint">Enter</span><button class="btn sm" id="gsearchBtn">검색</button>
    </div>
    <label class="toggle" title="목업 전용: 화면 요소에 설계 노트 번호를 표시"><input type="checkbox" id="notesChk"> 설계 노트</label>
    <div class="userbox">👤 <b id="userName">정물류</b> <select id="roleSel" title="역할 전환(목업 시연용)"><option>Editor</option><option>Viewer</option></select></div>
  </div>

  <main class="page" id="app"></main>

  <!-- Drawer / Modal / Toast / Tooltip -->
  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer"><div class="drawer-head" id="drawer-head"></div><div class="drawer-body" id="drawer-body"></div></aside>
  <div class="modal-bg" id="modal-bg"><div class="modal"><div class="modal-h"><h2 id="modal-title"></h2><button class="x" onclick="closeModal()">×</button></div><div class="modal-b" id="modal-body"></div><div class="modal-f" id="modal-foot"></div></div></div>
  <div id="toast"></div>
  <div class="tip" id="tip"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/logistics.js"></script>
  <script src="js/pages/shipping.js"></script>
  <script src="js/pages/stock.js"></script>
  <script src="js/pages/afab.js"></script>
  <script src="js/pages/kufri.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
